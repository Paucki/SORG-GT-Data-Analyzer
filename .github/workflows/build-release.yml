name: Build and publish SORG GT Data Analyzer

on:
  push:
    branches: [main]
    paths:
      - "app/version.py"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $text = Get-Content app\version.py -Raw
          if ($text -notmatch 'APP_VERSION\s*=\s*["'']([^"'']+)["'']') { throw "APP_VERSION not found." }
          $version = $Matches[1]
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=V$version" >> $env:GITHUB_OUTPUT

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app\requirements.txt

      - name: Syntax check
        shell: pwsh
        working-directory: app
        run: python -m py_compile main.py updater_client.py cloud_sync.py database.py dialogs.py report_generator.py version.py

      - name: Build application
        shell: pwsh
        working-directory: app
        run: python -m PyInstaller --noconfirm SORG_GT_Data_Analyzer.spec

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build installer
        shell: pwsh
        working-directory: app
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.version.outputs.version }}" installer.iss

      - name: Create update metadata
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $tag = "${{ steps.version.outputs.tag }}"
          $installer = "app\release\SORG_GT_Data_Analyzer_Setup.exe"
          if (-not (Test-Path $installer)) { throw "Installer was not created." }
          $sha = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          $latest = [ordered]@{
            version = $version
            url = "https://github.com/Paucki/SORG-GT-Data-Analyzer/releases/download/$tag/SORG_GT_Data_Analyzer_Setup.exe"
            sha256 = $sha
            notes = "Komplette Nordschleife vollständig sichtbar auf PC und Mobile | animierter Rennwagen | gespeicherte Anmeldung | Abmelden"
          }
          $latest | ConvertTo-Json | Set-Content update\latest.json -Encoding utf8
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update/latest.json
          git commit -m "Update metadata for $tag [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $tag = "${{ steps.version.outputs.tag }}"
          gh release create $tag "app\release\SORG_GT_Data_Analyzer_Setup.exe" --title "SORG GT Data Analyzer V$version" --notes "Die komplette Nürburgring Nordschleife ist im Startbildschirm auf PC und Mobile vollständig sichtbar. Animierter Rennwagen, gespeicherte Anmeldung und Abmelden bleiben enthalten."
